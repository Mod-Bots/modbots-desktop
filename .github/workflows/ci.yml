name: CI

on:
  push:
    branches:
      - main
      - release/v0.0.1-alpha
  pull_request:
    branches:
      - main
      - release/v0.0.1-alpha

permissions:
  contents: read

jobs:
  build:
    name: Build desktop app
    runs-on: ubuntu-latest

    steps:
      - name: Check out desktop repo
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build
